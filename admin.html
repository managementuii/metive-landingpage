const paper='#f8f8f2',blue='#193c91',ink='#172b50',yellow='#fff16b',sky='#bcdcff';
const canvas=document.getElementById('poster'),ctx=canvas.getContext('2d');
const nav=document.querySelector('nav'),download=document.getElementById('download'),statusLine=document.getElementById('status');
let current=0, logos=[];
function box(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
function font(size,display=false){ctx.font=(display?'700 ':'600 ')+size+'px "'+(display?'Space Grotesk':'DM Sans')+'"'}
function label(value,x,y,color=ink){ctx.fillStyle=color;ctx.fillText(value,x,y)}
function lines(value,width){
 const result=[];let line='';
 for(const word of value.split(' ')){const next=line?line+' '+word:word;if(line&&ctx.measureText(next).width>width){result.push(line);line=word}else line=next}
 if(line)result.push(line);return result;

function draw(index,videoFrame=false){
 current=index;
 const [name,title,intro,rows,footer]=slides[index];
 box(0,0,1080,1920,paper);
 for(let y=10;y<1920;y+=27)for(let x=12;x<1080;x+=27)box(x,y,2,2,'#b6c3d5');
 logo(logos[0],306,137,255,90);box(583,150,2,60,'#aab3c3');logo(logos[1],610,137,150,90);
 font(29,true);label('OPEN RECRUITMENT  /  METIVE 5.0',76,319,blue);
 const headingLimit=Math.min(120,...title.map(t=>{font(120,true);return Math.floor(902*120/ctx.measureText(t).width)}));
 const size=index>0&&index<6?Math.round(headingLimit*.82):headingLimit;
 font(size,true);
 let y=455;
 title.forEach((t,i)=>{if(i===title.length-1){const width=ctx.measureText(t).width+26,top=y-size*.82;box(72,top,width,size,sky);
  for(const [edge,handleY] of [[72,top],[72+width,top+size]]){box(edge-2,top,4,size,'#2469da');ctx.beginPath();ctx.arc(edge,handleY,9,0,2*Math.PI);ctx.fillStyle='#2469da';ctx.fill();}}
  label(t,82,y,blue);y+=size*.99;});

 document.getElementById("overlay-download").hidden=index!==1;
 box(76,1616,928,3,blue);font(33,true);label(footer,76,1687,blue);
 const caption='Poster '+(index+1)+' dari 7 · '+name;document.getElementById('caption').textContent=caption;canvas.setAttribute('aria-label',[...title,intro,...rows.flat(),footer].join('. '));
 [...nav.children].forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));statusLine.textContent='';
}
slides.forEach(([name],i)=>{const b=document.createElement('button');b.type='button';b.disabled=true;b.textContent=String(i+1).padStart(2,'0')+'  '+name;b.onclick=()=>draw(i);nav.append(b)});
function exportPoster(videoFrame=false){
 const index=current;
 if(videoFrame)draw(index,true);
 canvas.toBlob(blob=>{
  if(!blob){statusLine.textContent='Ekspor gagal. Coba lagi.';return}
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download='metive-story-0'+(index+1)+(videoFrame?'‑capcut':'')+'.png';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
 },'image/png');
 if(videoFrame)draw(index);
}
download.onclick=()=>exportPoster();
document.getElementById('overlay-download').onclick=()=>exportPoster(true);

 draw(0);download.disabled=false;[...nav.children].forEach(b=>b.disabled=false);
}
init().catch(()=>{statusLine.textContent='Poster belum bisa dimuat. Muat ulang halaman.'});
